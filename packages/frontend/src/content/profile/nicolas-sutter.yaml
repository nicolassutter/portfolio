bio: |-
  I am a **Technical Lead and freelance full-stack software engineer** based in Strasbourg, France. I design and deliver maintainable applications, from front-end architecture and design systems to APIs and developer tooling.

  I currently provide technical leadership at Carrefour, where I help guide the evolution of a large-scale platform used by millions of people. My work combines architecture, team collaboration, code quality, and pragmatic modernisation of existing systems.

  Previously, I led front-end architecture for a Vue.js component library shared across more than 40 applications, and have built accessible design systems, full-stack products, and developer platforms throughout my career.

  I care deeply about accessibility, performance, and maintainability. I enjoy turning complex technical constraints into clear, scalable solutions, mentoring developers, and strengthening the tools and practices that help teams move with confidence.

  My preferred stack includes **TypeScript, Vue/Nuxt, SolidJS, Node.js, and Go**. I am equally at home in monorepos, CI/CD pipelines, and open-source projects, and I keep exploring new technologies through personal projects and my self-hosted homelab.

  I am interested in roles and missions where thoughtful technical leadership, strong engineering practices, and product impact matter.
