  As Front-End and BFF Lead for Carrefour.fr's Core Team, I co-lead the modernisation of a large-scale platform serving millions of users. I help define the migration strategy from the legacy stack, guide technical priorities and code quality, and improve repository tooling and performance.

  I also led the creation and maintenance of **Marcel**, Carrefour's React Native design system, establishing a pnpm monorepo, automated changelogs, and end-to-end, accessibility, and unit testing practices.
