description: |-
  **Homebox** is my Debian home server, where Docker Compose stacks run a range of open-source services alongside my own projects. It gives me more control over my data and privacy, including for my media server and Immich photo library.

  I manage its services and access with Docker, Caddy, Tailscale, and Cloudflare DNS. [Learn more about my home lab](/homelab/).
